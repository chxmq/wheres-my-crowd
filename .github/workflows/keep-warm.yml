# Render's free instance sleeps after 15 idle minutes and takes ~50 s to wake.
# Ping the health check (no Qloo request) so judges and visitors get a warm app.
name: keep-warm
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://wheres-my-crowd.onrender.com/api/health
